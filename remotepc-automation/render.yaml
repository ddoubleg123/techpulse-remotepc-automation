services:
  # API Web Service
  # Note: Redis environment variables must be configured manually in Render dashboard
  - type: web
    name: techpulse-sync-api
    runtime: python
    plan: starter  # Free tier
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT api_service:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: False
      - key: RENDER
        value: true
      - key: TECHPULSE_API_URL
        value: https://api.techpulse.com
      # REDIS_HOST and REDIS_PORT should be set manually in Render dashboard
      # pointing to your existing Redis instance: red-d66d6m7gi27c738cuiv0

  # NOTE: Worker is NOT deployed on Render because RemotePC requires Windows + GUI
  # Run the worker locally on your Windows machine instead:
  # 1. Set REDIS_HOST in .env to your Render Redis URL
  # 2. Run: rq worker sync
